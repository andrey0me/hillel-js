<body>

    <script>
        let myArray = new Array(1,3,6,45,12,67,32,2,0);

        function getEvenNumbers(arr) {
            let evenArray = [];

            for (let i = 0; i < arr.length; i++) {
                if (arr[i]%2 === 0) {
                    evenArray.push(arr[i]);
                }
            }

            return evenArray;
        }
        
        console.log(getEvenNumbers(myArray));

    </script>
</body>
