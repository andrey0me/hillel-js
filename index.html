<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="body">
    <div class="slider" id="slider">
        <div class="slider-box" id="slider-box">
            <button class="slider-button prev" id="prev"></button>
            <img class="slider-el img-responsive visible" src="img/slider/1.jpg" id="img-1" alt="1">
            <img class="slider-el img-responsive" src="img/slider/2.jpg" id="img-2" alt="2">
            <img class="slider-el img-responsive" src="img/slider/3.jpg" id="img-3" alt="3">
            <img class="slider-el img-responsive" src="img/slider/4.jpg" id="img-4" alt="4">
            <img class="slider-el img-responsive" src="img/slider/5.jpg" id="img-5" alt="5">
            <img class="slider-el img-responsive" src="img/slider/6.jpg" id="img-6" alt="6">
            <img class="slider-el img-responsive" src="img/slider/7.jpg" id="img-7" alt="7">
            <img class="slider-el img-responsive" src="img/slider/8.jpg" id="img-8" alt="8">
            <img class="slider-el img-responsive" src="img/slider/9.jpg" id="img-9" alt="9">
            <img class="slider-el img-responsive" src="img/slider/10.jpg" id="img-10" alt="10">
            <button class="slider-button next" id="next"></button>
        </div>
        <div class="slider-nav-box" id="slider-nav-box">

        </div>
    </div>

    <script src="js/script.js"></script>
</body>

</html>
