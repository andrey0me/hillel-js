<body>

    <script>
        function sumNumbers() {
            let totalSum = 0;

            function add(someNum) {
                    return totalSum += someNum;
                };
            
            return add;
        }

        let sum1 = sumNumbers()

        console.log(sum1(4)); // 4

        console.log(sum1(6)); // 10

        console.log(sum1(10)); // 20

        console.log(sum1(7)); // 27

    </script>
</body>
