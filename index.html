<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <script>
        let n = prompt("Введите любое число");
        let result = "";
        if (isNaN(n) || n===null) {
            alert("Некорректный ввод");
        }
        else {
            for (let i = 1; i <= 100; i++) {
                
                if (Math.pow(i,2) <= n) {
                    result = result ? result + `\n${i}` : `Все числа, квадрат которых не привышает число ${n}:\n${i}`;
                }
                else {break;}
            }
        }
        console.log(result);
    </script>
</body>

</html>
