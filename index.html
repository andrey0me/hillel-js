<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="todo-list-box">
        <ul id="todo-ul" class="todo-list">
            <div class="todo-item" id="div-1">
                <li class="todo-item-name">Завдання 1</li><button id="del-1" name='del' type="button"
                    class="btn-del">Видалити</button>
            </div>
            <div class="todo-item" id="div-2">
                <li class="todo-item-name">Завдання 2</li><button id="del-2" name='del' type="button"
                    class="btn-del">Видалити</button>
            </div>
            <div class="todo-item" id="div-3">
                <li class="todo-item-name">Завдання 3</li><button id="del-3" name='del' type="button"
                    class="btn-del">Видалити</button>
            </div>
        </ul>
        <input id="input-add" type="text" placeholder="Додати нове завдання" class="input-add"><button name='add' type="button"
            class="btn-add">Додати</button>
    </div>

    <script src="js/script.js"></script>
</body>

</html>
