<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <script>
        let baseStr = prompt("Введіть рядок");
        let delChars = prompt("Введіть символи для видалення").split("");

        console.log(clearStr(baseStr, delChars));

        function clearStr(baseStr, delChars) {
            for (let i = 0; i < delChars.length; i++) {
                baseStr = baseStr.replace(delChars[i], "")
            }

            return baseStr;
        };
    </script>
</body>

</html>
