<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <script>
        function inputNumbers() {
            let num = 0;

            for (let i = 1; i <= 10; i++) {
                num = prompt("Введіть число більше 100")

                if ((num > 100) || (isNaN(num)) || (i === 10)) { console.log(num); break; }
            }
        }

        inputNumbers();

    </script>
</body>
