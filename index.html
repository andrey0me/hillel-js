<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDoList</title>

    <link href="./node_modules/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./dist/main.css">
</head>

<body class="body">
    <div class="wrapper">
        <div class="container">
            <h1>ToDoList</h1>
            <form class="form js--form">
                <div class="input-group mb-3">
                    <input type="text" name="value" required class="form__input js--form__input form-control"
                        placeholder="Введіть назву завдання" aria-label="Task name"
                        aria-describedby="button-addon2">
                    <button class="form__btn btn btn-success" type="button" id="button-addon2">Додати</button>
                </div>
            </form>
            <ul class="js--todos-wrapper list-group">

            </ul>
        </div>
    </div>

    <div class="modal fade" id="taskModal" tabindex="-1" aria-labelledby="taskModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="taskModalLabel">Деталі завдання</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p id="modalTaskText"></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрити</button>
                </div>
            </div>
        </div>
    </div>

    <script src="./node_modules/jquery/dist/jquery.min.js"></script>
    <script src="./node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
    <script src="./js/script.js"></script>
</body>

</html>
