<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="body">
    <form action="submit" method="POST" class="form needs-validation" id="cb-form">
        <h4 class="form-header4" id="cb-form-header4">We would like to help you</h4>
        <input type="text" class="input" id="cb-name" name="name" placeholder="Name">
        <textarea class="textarea" id="cb-msg" name="message" placeholder="Message"></textarea>
        <h5 class="form-header5" id="cb-form-header5">how to answer you</h5>
        <input type="tel" class="input" id="cb-phone" name="phone" placeholder="Phone number">
        <input type="email" class="input" id="cb-email" name="email" placeholder="Email">
        <button type="submit" class="form-button" id="cb-button">Send message</button>
    </form>

    <script src="js/script.js"></script>
</body>

</html>
