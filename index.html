<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <script>
        let n = prompt('Введите любое число');

        function isPrimeNumber(n) {
            if (n <= 1) {
                return 'Число должно быть больше 1';
            }

            for (let i = 2; i < n; i++) { // проверить, делится ли число..
                if (n % i == 0) return 'Составное число'; // не подходит, берём следующее
            }

            return 'Простое число';
        }

        if (isNaN(n) || n === null) {
            alert("Некорректный ввод");
        }
        else {
            alert(isPrimeNumber(n));
        }


    </script>
</body>

</html>
