<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <script>
        let arr = prompt("Введіть рядок").split("");

        let rmElem = prompt("Введіть елемент для видалення");

        if (isNaN(rmElem) === false) {
            console.log(removeElement(arr, rmElem));
        }

        function removeElement(arr, rmElem) {

            for (let i = 0; i < arr.length; i++) {
                if (arr[i] === rmElem) {
                    arr.splice(i,1);
                }
            }
        

            return arr;

        }

    </script>
</body>

</html>
